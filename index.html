<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Sogur</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A little corner of the internet belonging to Sogur.">
</head>

<body>
    <main class="page">
        <div class="profile">
            <div class="avatar-frame">
                <img class="pfp" src="imgs/Sogur-Profile-Picture.png" alt="Sogur's profile picture">
            </div>
            <p class="eyebrow"><span class="status-dot"></span> Sogur.dev</p>
            <h1>Sogur<span>.</span></h1>
            <p class="intro">Software Developer</p>

            <nav class="buttons" aria-label="Social links">
                <a class="social-link" href="https://github.com/Sokruh">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                    <span>GitHub</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external-icon" aria-hidden="true"></i>
                </a>
                <a class="social-link" href="https://discord.gg/kontula">
                    <i class="fa-brands fa-discord" aria-hidden="true"></i>
                    <span>Discord</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external-icon" aria-hidden="true"></i>
                </a>
            </nav>

            <p class="footer-note">Fiiliksen mukaan since 2023<span aria-hidden="true"></span></p>
        </div>
    </main>
</body>

</html>
